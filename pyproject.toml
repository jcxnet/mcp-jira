[project]
name = "mcp-jira"
version = "0.1.0"
description = "MCP stdio server exposing Jira Data Center REST v2 tools to AI agents"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x dropped FastMCP (breaking SDK rewrite); design targets FastMCP.
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.scripts]
mcp-jira = "mcp_jira.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_jira"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]