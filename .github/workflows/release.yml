name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: mcp-jira-linux-x86_64
          - name: macos
            os: macos-latest
            artifact: mcp-jira-macos-x86_64
          - name: windows
            os: windows-latest
            artifact: mcp-jira-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller
      - name: Install project
        run: python -m pip install .
      - name: Build binary
        run: pyinstaller --onefile --name mcp-jira --paths src --collect-all mcp_jira src/mcp_jira/__main__.py
      - name: Rename artifact
        shell: bash
        run: mv dist/mcp-jira dist/${{ matrix.artifact }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
